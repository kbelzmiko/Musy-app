<div class="group hover:bg-ac1/40 hover:shadow-md hover:shadow-neutral-800 p-2 rounded-2xl w-full" (contextmenu)="onRightClick($event)">
    <div class="flex justify-between">
        <button (click)="playSong()" class="ml-3 group-hover:scale-105 duration-100 transform">
            <div class="z-10 absolute opacity-0 hover:opacity-80 w-full duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512" class="fill-ac1 mt-2 ml-2.5 size-10"><path d="M73 39c-14.8-9.1-33.4-9.4-48.5-.9S0 62.6 0 80L0 432c0 17.4 9.4 33.4 24.5 41.9s33.7 8.1 48.5-.9L361 297c14.3-8.7 23-24.2 23-41s-8.7-32.2-23-41L73 39z"/></svg>
            </div>
            <div class="flex gap-5">
                <img [src]="coverUrl" class="z-0 rounded-xl size-14">
                <div class="grid grid-cols-1 text-left">
                    <h1 class="text-xl">{{title}}</h1>
                    <p class="text-neutral-400 text-sm">{{artist}}</p>
                </div>
            </div>
        </button>
        <div class="flex gap-5">
            <h1 class="mt-auto text-neutral-400 text-sm">{{duration}}</h1>
        </div>
    </div>
</div>
